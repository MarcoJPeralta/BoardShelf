<div class="auth-container">
  <header>
    <h2>{{ view() === 'login' ? 'Welcome back' : 'Create Account' }}</h2>
    <button class="close-btn" type="button" aria-label="Close" (click)="dialogRef.close()">×</button>
  </header>

  <button class="google-btn btn-base" (click)="loginWithGoogle()">
    <img src="/images/icons/google.webp" alt="Google Logo" /> Login with Google
  </button>

  <div class="divider"><span>OR</span></div>

  <form (submit)="handleEmailAuth(); $event.preventDefault()">
    <input
      type="email"
      [(ngModel)]="email"
      name="email"
      placeholder="Email"
      aria-label="Email"
      required
    />
    <input
      type="password"
      [(ngModel)]="password"
      name="password"
      placeholder="Password"
      aria-label="Password"
      required
    />

    <button type="submit" class="btn-main">
      {{ view() === 'login' ? 'Login' : 'Signup' }}
    </button>
  </form>

  @if (errorMessage()) {
    <p class="auth-error" role="alert">{{ errorMessage() }}</p>
  }

  <footer>
    @if (view() === 'login') {
      <button class="btn-link" (click)="switchView('signup')">Don't have an account? Signup</button>
    } @else {
      <button class="btn-link" (click)="switchView('login')">Already have an account? Login</button>
    }
  </footer>
</div>
